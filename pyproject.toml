[project]
name = "ukraine-air-alert-forecast"
version = "0.1.0"
description = "Leakage-free forecasting of air raid alerts in Ukraine by region"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
]

[project.scripts]
alerts = "alerts.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alerts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
